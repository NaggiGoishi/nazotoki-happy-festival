<title>戦国なぞとき 早雲の作戦室</title>
<meta name="description" content="冊子『戦国なぞとき 作戦ノート』のこたえを入力して、北条早雲と大庭城を攻める作戦をすすめるサイト。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 冊子と同じ世界観：和紙の地に藍の文字、朱のはんこ、金の罫。スマホ1列、場面を1枚ずつめくる紙芝居の構成。 */
:root{
  --washi:#f5ecda; --washi-light:#fcf6ea; --ink:#26364e; --body:#33363b; --muted:#6f6656;
  --shu:#b4432f; --gold:#b38e52; --gold-soft:#dbc7a0; --pine:#3f6352; --night:#1f2c40;
  --ok:#3f6352; --ng:#a8392a;
  --display:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --text:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--washi);color:var(--body);font-family:var(--text);font-size:16px;line-height:1.9;
  background-image:repeating-linear-gradient(104deg,transparent 0 10px,rgba(201,179,138,.06) 10px 11px),repeating-linear-gradient(17deg,transparent 0 13px,rgba(255,255,255,.18) 13px 14px)}
ruby{ruby-position:over}rt{font-size:.5em;font-weight:500;color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--shu);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

/* 上の帯：題名と3つの任務のはんこ */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--washi) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--gold-soft)}
.top-in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;color:var(--ink);font-size:15px;letter-spacing:.06em;line-height:1.3}
.brand small{display:block;font-family:var(--text);font-weight:500;font-size:10px;color:var(--muted);letter-spacing:.12em}
.seals{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.seals li{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;color:var(--gold);border:1.5px dashed var(--gold-soft)}
.seals li.now{color:var(--shu);border:1.5px solid var(--shu)}
.seals li.done{background:var(--shu);color:#fff;border:1.5px solid var(--shu);box-shadow:0 0 0 2px var(--washi),0 0 0 3px var(--shu)}

.scene{display:flex;flex-direction:column;gap:20px;padding-top:20px;animation:turn .45s ease both}
@keyframes turn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.scene{animation:none}}

/* 表紙 */
.cover{position:relative;border:2px solid var(--ink);outline:1px solid var(--gold);outline-offset:-7px;background:#f3eee4;aspect-ratio:1053/1300;overflow:hidden;max-width:100%}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0}
.daisen{position:absolute;left:14px;top:14px;background:var(--washi-light);border:1.5px solid var(--ink);outline:1px solid var(--gold);outline-offset:-5px;padding:12px 14px 10px;text-align:center;color:var(--ink);box-shadow:3px 4px 0 rgba(38,54,78,.15)}
.daisen .k{display:block;font-family:var(--display);font-weight:800;color:var(--shu);font-size:13px;letter-spacing:.3em}
.daisen h1{margin:2px 0 0;font-family:var(--display);font-weight:800;font-size:30px;line-height:1.15;letter-spacing:.04em}
.daisen .s{display:block;font-family:var(--display);font-weight:600;font-size:13px;margin-top:4px;letter-spacing:.1em}
.lede{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.85;color:var(--ink);text-align:center;margin:0;text-wrap:balance}
.need{margin:0;text-align:center;font-size:13px;color:var(--muted)}

/* ボタン */
.btn{display:block;text-align:center;padding:6px 14px;line-height:1.5;width:100%;min-height:56px;border:0;border-radius:6px;background:var(--shu);color:#fff;font-weight:700;font-size:17px;letter-spacing:.06em;box-shadow:0 3px 0 #7d2c1f}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7d2c1f}
.btn.quiet{background:transparent;color:var(--ink);border:1.5px solid var(--ink);box-shadow:none;min-height:46px;font-size:15px}
.btn.cont small{display:block;font-size:13px;font-weight:600;opacity:.9;letter-spacing:.04em}
.btn small.pre{display:block;font-size:12px;font-weight:600;letter-spacing:.12em;opacity:.85;line-height:1.3}
.btn .arrow{font-family:var(--display);margin-left:.45em}

/* ムービー（仮置き） */
.movie{border-radius:6px;overflow:hidden;background:var(--night);color:#efe6d2;border:1px solid var(--night)}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;background:radial-gradient(120% 90% at 75% 100%,#3a4c67 0%,#1f2c40 60%);overflow:hidden}
.screen::before{content:'';position:absolute;inset:10px;border:1px solid rgba(219,199,160,.35);border-radius:3px;pointer-events:none}
.screen img{position:absolute;right:4%;bottom:0;height:96%;width:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.screen .scenery{position:absolute;inset:auto 0 0 0;height:28%;background:linear-gradient(transparent,rgba(17,25,38,.55))}
.screen-meta{position:absolute;left:20px;top:18px;right:42%;display:flex;flex-direction:column;gap:6px}
.chip{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--night);background:#e9c98a;border-radius:3px;padding:1px 8px}
.screen-title{font-family:var(--display);font-weight:800;font-size:clamp(17px,4.6vw,23px);line-height:1.45;color:#fff;margin:0;text-wrap:balance}
.screen-time{font-size:12px;color:#cfc4ad}
.play{position:absolute;left:20px;bottom:18px;width:52px;height:52px;border-radius:50%;border:2px solid #efe6d2;background:rgba(255,255,255,.08);color:#efe6d2;display:grid;place-items:center}
.play svg{width:20px;height:20px;margin-left:3px;fill:currentColor}
.play-note{position:absolute;left:84px;bottom:28px;font-size:12px;color:#e9dcc0}
.script{background:var(--washi-light);color:var(--body);border-top:3px double var(--gold)}
.script summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--ink);font-size:14px}
.script summary::-webkit-details-marker{display:none}
.script summary::after{content:'ひらく';font-size:12px;color:var(--shu);font-weight:700}
.script[open] summary::after{content:'とじる'}
.lines{margin:0;padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.lines p{margin:0;font-size:15px;line-height:1.85}
.lines .togaki{font-size:13px;color:var(--muted);border-left:3px solid var(--gold-soft);padding-left:10px}
.lines .who{display:inline-block;min-width:4.6em;font-weight:700;color:var(--shu);font-size:13px}

/* 任務の札 */
.mission{background:var(--washi-light);border:1px solid var(--gold-soft);border-top:4px double var(--gold);padding:20px 18px 18px;display:flex;flex-direction:column;gap:16px}
.mission-head{display:flex;align-items:center;gap:14px}
.no{flex:none;width:56px;height:56px;border-radius:50%;background:var(--shu);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;box-shadow:0 0 0 3px var(--washi-light),0 0 0 4px var(--shu)}
.mission-head p{margin:0;font-size:12px;font-weight:700;letter-spacing:.3em;color:var(--shu)}
.mission-head h2{margin:0;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.5;color:var(--ink);text-wrap:balance}
.letter{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:start}
.letter img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:1.5px solid var(--gold);box-shadow:0 0 0 3px var(--washi-light),0 0 0 4px var(--gold-soft)}
.letter img.gm{object-position:50% 12%;background:var(--washi)}
.from{margin:0 0 2px;font-size:12px;font-weight:700;color:var(--shu);letter-spacing:.08em}
.voice{margin:0;font-family:var(--display);font-weight:600;font-size:17px;line-height:1.95;color:var(--ink)}
.pages{list-style:none;margin:0;padding:0;border-top:1px solid var(--gold-soft)}
.pages li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px dotted var(--gold)}
.tag{font-size:12px;font-weight:700;color:#fff;background:var(--ink);border-radius:3px;padding:0 8px;white-space:nowrap}
.pages span:nth-child(2){font-family:var(--display);font-weight:600;color:var(--ink)}
.pages em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}

/* こたえの入力 */
.answer{display:flex;flex-direction:column;gap:10px}
.answer label{font-weight:700;color:var(--ink);font-size:16px}
.answer .fmt{font-size:13px;color:var(--muted);margin:-6px 0 0}
.answer input{width:100%;min-height:58px;border:2px solid var(--ink);border-radius:6px;background:#fffaf0;padding:10px 14px;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.12em;color:var(--ink)}
.answer input[aria-invalid="true"]{border-color:var(--ng)}
.reply{margin:0;min-height:1.9em;font-size:15px;font-weight:700;color:var(--ng)}
.reply.ok{color:var(--ok)}

/* ヒント */
.hints{border:1px solid var(--gold-soft);background:var(--washi);border-radius:6px}
.hints>summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.hints>summary::-webkit-details-marker{display:none}
.hints>summary::after{content:'＋';color:var(--shu);font-size:18px}
.hints[open]>summary::after{content:'－'}
.hint-group{padding:4px 16px 14px;display:flex;flex-direction:column;gap:12px}
.hint-q{display:flex;flex-direction:column;gap:6px}
.hint-q h3{margin:0;font-size:14px;color:var(--ink);display:flex;gap:8px;align-items:center}
.hint-q ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.hint-q li{font-size:14px;line-height:1.8;background:var(--washi-light);border-left:3px solid var(--gold);padding:6px 10px}
.hint-q li[hidden]{display:none}
.more{align-self:flex-start;background:transparent;border:1px solid var(--shu);color:var(--shu);border-radius:999px;padding:2px 14px;font-size:13px;font-weight:700}

/* 水の庭の決まり */

/* 作戦せいこう */
.done-card{text-align:center;background:var(--washi-light);border:2px solid var(--ink);outline:1px solid var(--gold);outline-offset:-8px;padding:28px 18px;display:flex;flex-direction:column;gap:14px;align-items:center}
.done-card .big{width:96px;height:96px;border-radius:50%;background:var(--shu);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.25;box-shadow:0 0 0 4px var(--washi-light),0 0 0 5.5px var(--shu)}
.done-card h2{margin:0;font-family:var(--display);font-weight:800;font-size:26px;color:var(--ink)}
.plan{font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink);letter-spacing:.08em;border-block:3px double var(--gold);padding:8px 16px;margin:0}
.done-card label{font-size:13px;color:var(--muted)}
.done-card input{border:0;border-bottom:1.5px solid var(--gold);background:transparent;font-family:var(--display);font-size:20px;text-align:center;color:var(--ink);width:min(260px,100%);padding:4px}
.foot{font-size:12px;color:var(--muted);line-height:1.8;margin:0}
.confirm{display:flex;gap:10px}
.confirm .btn{min-height:46px;font-size:15px}

/* ===== スマホ前提：1画面ずつ、下に親指で押せる操作バー ===== */
:root{--col:440px;--dock-h:84px}
body{background-color:#eadfc6}
.wrap,.top-in,.dock-in{max-width:var(--col)}
.wrap{background:var(--washi);min-height:100dvh;padding-block:0 calc(var(--dock-h) + 24px + env(safe-area-inset-bottom,0px));box-shadow:0 0 0 1px rgba(179,142,82,.25)}
.top{background:color-mix(in srgb,var(--washi) 94%,transparent)}
.top-in{padding:8px 16px;min-height:56px;justify-content:flex-start}
.brand{margin-right:auto;font-size:15px}
.back{flex:none;width:40px;height:40px;margin-left:-8px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;border-radius:50%}
.back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.seals li{width:30px;height:30px;font-size:14px;font-family:var(--display)}
.scene{gap:18px;padding-top:16px}
.cover,.movie{margin-inline:-16px;width:calc(100% + 32px);max-width:none;border-radius:0;border-left:0;border-right:0}
.cover{outline-offset:-8px;aspect-ratio:auto;height:min(119vw,54svh);min-height:300px}
.cover{background:#f6f2e8}
.cover img{object-fit:contain;object-position:50% 100%}
.daisen{left:16px;top:16px}
.daisen h1{font-size:28px}
.lede{font-size:18px}
.movie .screen::before{inset:8px}
.screen-meta{left:16px;top:14px;right:44%}
.play{left:16px;bottom:14px;width:48px;height:48px}
.play-note{left:74px;bottom:26px}
.script summary{padding:12px 16px;min-height:48px}
.lines p{font-size:15px}
.mission{margin-inline:-4px;padding:18px 16px 16px}
.mission-head h2{font-size:20px}
.voice{font-size:16px}
.answer input{font-size:22px;min-height:56px}
.hints>summary{min-height:52px}
.more{min-height:36px;padding:4px 16px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--washi) 28%);pointer-events:none}
.dock-in{margin:0 auto;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.dock .btn{min-height:58px;font-size:18px;border-radius:12px}
.dock .confirm{display:flex;gap:10px}.dock .confirm .btn{min-height:52px;font-size:16px}
.dock .ask{margin:0;text-align:center;font-size:14px;font-weight:700;color:var(--ink);background:var(--washi-light);border-radius:8px;padding:4px}
@media (min-width:640px){.wrap{border-left:1px solid var(--gold-soft);border-right:1px solid var(--gold-soft)}}

/* ===== ワクワクの演出：封を切ると戦国の世界がひらく ===== */
:root{--night-deep:#141d2c;--petal:#f2c3c6}
.intro{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 110%,#2c3c57 0%,var(--night-deep) 62%);color:#efe6d2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));overflow:hidden;transition:opacity .9s ease,visibility .9s}
.intro.gone{opacity:0;visibility:hidden}
.intro canvas,.petals{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.moon{position:absolute;top:9%;right:12%;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff4d6,#e9c98a 70%);box-shadow:0 0 60px 18px rgba(233,201,138,.25);opacity:.9}
.intro-kicker{position:relative;font-size:13px;letter-spacing:.32em;color:#e9c98a;margin:0;animation:fadeup 1.2s .3s both}
.intro-line{position:relative;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.7;text-align:center;margin:0;color:#fff;animation:fadeup 1.2s .7s both;text-wrap:balance}
.letter-env{position:relative;width:min(300px,82vw);aspect-ratio:3/2;background:linear-gradient(160deg,#fbf3e1,#efe2c4);border-radius:4px;box-shadow:0 18px 40px rgba(0,0,0,.45);display:grid;place-items:center;animation:float 4s ease-in-out infinite,fadeup 1.2s 1.1s both}
.letter-env::before,.letter-env::after{content:'';position:absolute;left:0;right:0;top:0;height:55%;background:linear-gradient(to bottom right,transparent 49.5%,rgba(179,142,82,.35) 50%,transparent 50.6%),linear-gradient(to bottom left,transparent 49.5%,rgba(179,142,82,.35) 50%,transparent 50.6%)}
.letter-env::after{display:none}
.env-to{position:absolute;left:18px;bottom:14px;font-family:var(--display);font-weight:600;font-size:13px;color:var(--ink);letter-spacing:.1em}
.seal-btn{position:relative;width:78px;height:78px;border-radius:50%;border:0;background:radial-gradient(circle at 38% 34%,#d2583f,#a33724 70%);box-shadow:0 0 0 4px rgba(180,67,47,.25),0 6px 14px rgba(0,0,0,.35);display:grid;place-items:center;color:#fbe8d8;animation:pulse 2.2s ease-in-out infinite}
.seal-btn svg{width:34px;height:30px;fill:currentColor}
.seal-btn.broke{animation:crack .6s ease forwards}
.tap{position:relative;margin:0;font-size:14px;letter-spacing:.2em;color:#e9dcc0;animation:fadeup 1s 1.6s both,blink 2.2s 2.6s ease-in-out infinite}
.skip{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:transparent;border:1px solid rgba(239,230,210,.4);color:#e9dcc0;border-radius:999px;padding:6px 14px;font-size:12px;min-height:36px}
.scroll{position:relative;width:min(340px,88vw);background:var(--washi-light);color:var(--ink);border-block:6px solid #8f6340;box-shadow:0 18px 40px rgba(0,0,0,.45);padding:22px 20px;display:flex;flex-direction:column;gap:12px;clip-path:inset(0 50% 0 50%);transition:clip-path 1.1s cubic-bezier(.2,.8,.2,1)}
.scroll.open{clip-path:inset(0 0 0 0)}
.scroll::before,.scroll::after{content:'';position:absolute;top:-10px;bottom:-10px;width:10px;border-radius:5px;background:linear-gradient(90deg,#6f4a2c,#a87a4f,#6f4a2c)}
.scroll::before{left:-6px}.scroll::after{right:-6px}
.scroll p{margin:0;font-family:var(--display);font-weight:600;font-size:17px;line-height:1.9;opacity:0;transform:translateY(6px);transition:opacity .6s,transform .6s}
.scroll p.on{opacity:1;transform:none}
.scroll .sig{text-align:right;font-size:14px;color:var(--shu)}
.open-btn{opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s;width:min(340px,88vw)}
.open-btn.on{opacity:1;transform:none}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-6px) rotate(-.6deg)}}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(180,67,47,0),0 6px 14px rgba(0,0,0,.35)}}
@keyframes blink{50%{opacity:.45}}
@keyframes crack{30%{transform:scale(1.15) rotate(-8deg)}100%{transform:scale(.2) rotate(40deg);opacity:0}}

/* 表紙：ゆっくり寄る絵、はんこの押される題簽、光る開始ボタン */
.cover img{animation:kenburns 14s ease-out both}
@keyframes kenburns{from{transform:scale(1.12) translateY(2%)}to{transform:none}}
.cover .petals{z-index:1}
.daisen{z-index:2;animation:stamp .7s .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{opacity:0;transform:scale(1.8) rotate(-6deg)}to{opacity:1;transform:none}}
.lede{animation:fadeup 1s 1s both}.need{animation:fadeup 1s 1.3s both}
.dock .btn.glow{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 3px 0 #7d2c1f,0 0 0 8px rgba(180,67,47,.18)}}
.mission .no{animation:stamp .6s .15s cubic-bezier(.3,1.6,.5,1) both}

/* 正解のはんこ */
.hit{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(245,236,218,.72);backdrop-filter:blur(2px);animation:fadein .2s both}
.hit .petals{position:absolute;inset:0}
.hanko{position:relative;width:170px;height:170px;border-radius:50%;border:7px solid var(--shu);color:var(--shu);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:54px;letter-spacing:.06em;background:rgba(252,246,234,.6);box-shadow:inset 0 0 0 4px rgba(252,246,234,.9),inset 0 0 0 7px var(--shu);animation:hanko .55s cubic-bezier(.3,1.6,.5,1) both;transform:rotate(-8deg)}
.hit p{position:absolute;bottom:22%;left:0;right:0;text-align:center;font-family:var(--display);font-weight:800;font-size:20px;color:var(--ink);margin:0;animation:fadeup .6s .35s both}
@keyframes hanko{from{transform:scale(2.4) rotate(-20deg);opacity:0}70%{opacity:1}to{transform:scale(1) rotate(-8deg);opacity:1}}
@keyframes fadein{from{opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

const save = () => { try { localStorage.setItem('sengoku-nazo', JSON.stringify(state)); } catch (e) {} };

function normalize(v){
  return v.normalize('NFKC')
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[\s、。，．,.！!？?「」『』・ー〜~]/g, '')
    .replaceAll('牡丹餅','ぼたもち').replaceAll('ぼた餅','ぼたもち')
    .replaceAll('沼','ぬま').replaceAll('水','みず').replaceAll('抜','ぬ')
    .replaceAll('南','みなみ').replaceAll('堤','つつみ').replaceAll('切','き');
}

function seals(){
  // 任務の こたえの 画面を すぎたら おわり。いま とりくんで いる 任務は いちばん 小さい のこりの 番号。
  const doneOf = n => state.step > STEPS.findIndex(s => s.type === 'mission' && s.seal === n);
  const now = [1,2,3].find(n => !doneOf(n)) || 0;
  [1,2,3].forEach(n => {
    const el = document.getElementById('seal-' + n);
    el.className = doneOf(n) ? 'done' : (n === now && state.step > 0 ? 'now' : '');
    el.setAttribute('aria-label', `任務${n}` + (el.className === 'done' ? ' おわり' : el.className === 'now' ? ' いまここ' : ''));
  });
}

function go(n){ state.step = Math.max(0, Math.min(STEPS.length - 1, n)); save(); render(); window.scrollTo({top:0, behavior:'smooth'}); }
const next = () => go(state.step + 1);

function hintsHTML(h){

}

  if (hero) { hero.value = state.name || ''; hero.addEventListener('input', () => { state.name = hero.value; save(); if (lastPhoto) composePhoto(lastPhoto); }); }
  // SNSの 動線
  const SHARE_TEXT2 = `${SHARE_TEXT}（称号：${rankOf()[0]}／のこった兵 ${state.soldiers}人）`;
  const shareText = SHARE_TEXT2 + ' ' + SHARE_TAGS.map(x => '#' + x).join(' ');
  const st = app.querySelector('#share-text');
  if (st) {
    const plain = shareText + (SHARE_URL ? ' ' + SHARE_URL : '');
    st.dataset.copy = plain;
    st.innerHTML = SHARE_TEXT2 + ' ' + SHARE_TAGS.map(x => `<span class="tagword">#${x}</span>`).join(' ') + (SHARE_URL ? ' ' + SHARE_URL : '');
    const q = encodeURIComponent;
    app.querySelector('#sns-x').href = `https://twitter.com/intent/tweet?text=${q(SHARE_TEXT2)}&hashtags=${q(SHARE_TAGS.join(','))}${SHARE_URL ? '&url=' + q(SHARE_URL) : ''}`;
    app.querySelector('#sns-line').href = `https://line.me/R/msg/text/?${q(shareText + (SHARE_URL ? ' ' + SHARE_URL : ''))}`;
    const fb = app.querySelector('#sns-fb');
    if (SHARE_URL) fb.href = `https://www.facebook.com/sharer/sharer.php?u=${q(SHARE_URL)}`; else fb.remove();
    app.querySelector('#share-file').addEventListener('click', savePhoto);
    app.querySelector('#copy').addEventListener('click', () => {
      const msg = app.querySelector('#copy-msg');
      const done = () => { msg.textContent = 'コピーしたよ。投稿の らんに はりつけてね。'; };
      const fallback = () => { const sel = getSelection(), rg = document.createRange(); rg.selectNodeContents(st); sel.removeAllRanges(); sel.addRange(rg); msg.textContent = '文を えらんだよ。長おしして コピーしてね。'; };
      try { navigator.clipboard.writeText(st.dataset.copy).then(done, fallback); } catch (e) { fallback(); }
    });
  }
  ['#cam', '#lib'].forEach(sel => app.querySelector(sel)?.addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    const msg = app.querySelector('#photo-msg'); msg.textContent = 'しゃしんを つくっています…';
    const url = URL.createObjectURL(f), im = new Image();
    im.onload = () => { lastPhoto = im; composePhoto(im).then(() => { msg.textContent = ''; taiko(0, .8); taiko(.2, .7); app.querySelector('#share')?.classList.add('ready'); }); };
    im.onerror = () => { msg.textContent = 'しゃしんを ひらけませんでした。べつの しゃしんで ためしてね。'; URL.revokeObjectURL(url); };
    im.src = url;
  }));
}

// ---------- 演出：音（タップ後だけ鳴らす）・花びら・はんこ ----------
let soundOn = true; try { soundOn = localStorage.getItem('sengoku-sound') !== 'off'; } catch (e) {}
let ac = null;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function audio(){ if (!soundOn) return null; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; } return ac; }
function taiko(delay = 0, vol = .9){
  const c = audio(); if (!c) return; const t = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(48, t + .35);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + .6);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + .62);
  const n = c.createBuffer(1, c.sampleRate * .08, c.sampleRate), d = n.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = c.createBufferSource(), f = c.createBiquadFilter(), ng = c.createGain();
  s.buffer = n; f.type = 'lowpass'; f.frequency.value = 900; ng.gain.value = vol * .5;
  s.connect(f).connect(ng).connect(c.destination); s.start(t);
}
function rin(delay = 0){
  const c = audio(); if (!c) return; const t = c.currentTime + delay;
  [[1046, .25], [1568, .12], [2093, .06]].forEach(([fr, v]) => {
    const o = c.createOscillator(), g = c.createGain(); o.frequency.value = fr;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0005, t + 2.2);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + 2.3);
  });
}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const soundBtn = document.getElementById('sound');
function paintSound(){ soundBtn.setAttribute('aria-pressed', String(soundOn)); soundBtn.setAttribute('aria-label', soundOn ? '音を けす' : '音を だす'); soundBtn.querySelector('#wave').style.display = soundOn ? '' : 'none'; }
soundBtn.addEventListener('click', () => { soundOn = !soundOn; try { localStorage.setItem('sengoku-sound', soundOn ? 'on' : 'off'); } catch (e) {} paintSound(); if (soundOn) rin(); });
paintSound();

// 花びら（Canvas）。burst=true で ぱっと ひろがる
function petals(canvas, {count = 26, burst = false, life = Infinity} = {}){
  if (!canvas || reduce) return () => {};
  const ctx = canvas.getContext('2d'); let w, h, raf, alive = true; const born = performance.now();
  const fit = () => { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); w = r.width; h = r.height; canvas.width = w * dpr; canvas.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  fit(); addEventListener('resize', fit);
  const cols = ['#f2c3c6', '#f7d9db', '#e3a6ab', '#fff1f1'];
  const ps = Array.from({length: count}, () => burst
    ? {x: w / 2, y: h / 2, vx: (Math.random() - .5) * 9, vy: (Math.random() - .9) * 9, s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.random() * 4 | 0]}
    : {x: Math.random() * w, y: Math.random() * h - h, vx: .3 + Math.random() * .6, vy: .6 + Math.random() * 1.1, s: 4 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - .5) * .06, c: cols[Math.random() * 4 | 0]});
  const tick = now => {
    if (!alive) return; ctx.clearRect(0, 0, w, h);
    const fade = life === Infinity ? 1 : Math.max(0, 1 - (now - born) / life);
    ps.forEach(p => {
      if (burst) { p.vy += .18; p.vx *= .99; } else { p.vx += Math.sin((now / 900) + p.r) * .01; }
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if (!burst && p.y > h + 10) { p.y = -10; p.x = Math.random() * w; }
      ctx.save(); ctx.globalAlpha = .85 * fade; ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * .55, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
    if (fade > 0) raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  return () => { alive = false; cancelAnimationFrame(raf); removeEventListener('resize', fit); };
}

// 正解のはんこ
function celebrate(then){
  const el = document.createElement('div'); el.className = 'hit'; el.setAttribute('role', 'status');
  el.innerHTML = `<canvas class="petals"></canvas><div class="hanko">正解</div><p>うむ、そのとおりだ！</p>`;
  document.body.append(el); taiko(0, 1); taiko(.22, .8); buzz([30, 60, 30]);
  const stop = petals(el.querySelector('canvas'), {count: 46, burst: true, life: 1600});
  setTimeout(() => { stop(); el.remove(); then(); }, reduce ? 600 : 1650);
}

// はじまりの演出
const intro = document.getElementById('intro');
let stopIntroPetals = () => {};
function closeIntro(){ intro.classList.add('gone'); stopIntroPetals(); setTimeout(() => { intro.hidden = true; }, 900); render(); }
if (state.step === 0) {
  stopIntroPetals = petals(document.getElementById('intro-petals'), {count: 30});
  document.getElementById('seal-open').addEventListener('click', e => {
    e.currentTarget.classList.add('broke'); taiko(0, 1); rin(.35); buzz(40);
    setTimeout(() => {
      document.getElementById('intro-a').hidden = true;
      const b = document.getElementById('intro-b'); b.hidden = false;
      const sc = document.getElementById('scroll'); requestAnimationFrame(() => sc.classList.add('open'));
      [...sc.querySelectorAll('p')].forEach((p, i) => setTimeout(() => p.classList.add('on'), (reduce ? 0 : 900) + i * (reduce ? 0 : 650)));
      setTimeout(() => document.getElementById('intro-go').classList.add('on'), reduce ? 0 : 900 + 4 * 650);
    }, reduce ? 0 : 550);
  });
  document.getElementById('intro-go').addEventListener('click', () => { taiko(0, .9); closeIntro(); });
  document.getElementById('skip').addEventListener('click', closeIntro);
} else { intro.hidden = true; }
if (state.step !== 0) render();
})();
</script>
